# Social persona: who a player is socially (SOCIAL-WORLD-DRAFT.md, part 7). Read by the simulator (rl/ogsim
# src/persona.rs) and, from phase E, by the module. Pure data: no game object is named here.
#
# A person is 12 continuous traits in 0..1. Each account is born near one archetype (drawn by `share`), with gaussian
# noise of `spread` per trait, clamped to 0..1. The traits then drift with experience (`drift`).
#
# Grounding: moral foundations (Haidt: care, fairness, loyalty, authority, liberty) and the dark triad
# (machiavellianism = cunning, narcissism ≈ dominance + ambition, psychopathy ≈ cruelty − forgiveness).
# Shares are a prior to be tuned against real-server outcomes (SOCIAL-STEP1-AUDIT.md): an honest majority, a
# betraying minority (Peskov 2020: lies are rare), about 30% who keep to themselves.

traits:
  ambition: wants to rise in rank, points and power
  honesty: says what it means and keeps its word (honour); low means hypocrisy comes easily
  loyalty: stands by its alliance, leader and partners at its own cost
  cruelty: harms the weak without need; low means mercy
  cunning: plans, deceives and manipulates (machiavellianism)
  courage: fights when outmatched; low means it yields or flees
  generosity: gives resources and help without a return
  dominance: wants others under its control (tyranny, colonialism)
  freedom: refuses to be controlled (resistance, revolt)
  authority: respects hierarchy and obeys the leader
  forgiveness: lets grudges go once amends are made
  vindictiveness: repays harm, long after

spread: 0.08

