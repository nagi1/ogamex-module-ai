# How experience moves the traits (a slow learning rate per event, clamped to 0..1).
drift:
  betrayed: { loyalty: -0.06, forgiveness: -0.05, vindictiveness: +0.05, cunning: +0.03 }
  helped: { loyalty: +0.03, generosity: +0.02 }
  victory: { ambition: +0.02, dominance: +0.02, courage: +0.02 }
  defeat: { courage: -0.03, forgiveness: +0.01 }
  dominated: { freedom: +0.04, vindictiveness: +0.03 }
  betrayal_unpunished: { honesty: -0.04, cunning: +0.03 }
  betrayal_exposed: { cunning: -0.02, honesty: +0.02 }
