# What the host or the module's own dispatch gate refused, and how long that refusal cools what it blamed.
#
# A dispatch the gate refuses is not a mission, so nothing a planner read recorded it and the same
# target -- or the same body the fleet would have left from -- was offered again on the next login
# (measured 4 Oct 2026: 112 repeats of the same account+target+reason in six hours, one target 21 times).
#
# The cooling is the one a launched mission already buys its target: inside it the account tries
# something else instead of the dispatch it was just told is impossible. It is stated in the span the
# cohort's DISPATCH_REFUSALS invariant counts, because a cooling shorter than that span lets the same
# refusal be repeated inside the window the invariant measures, which is exactly the defect.
cooling_minutes: 360

# The span is a fleet's: it is stated for a universe up to this fleet speed and shrinks with a faster one, where the
# missing fleet is home and the busy yard done in minutes (8 Nov 2026, 1000x: 1,033 of 1,039 raids dropped by a
# six-hour cooling). It never goes below the minimum, so a refusal still is not repeated on the next login.
reference_fleet_speed: 8
minimum_minutes: 10
