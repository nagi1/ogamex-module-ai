# How alliances go to war and what their leaders say (alliance-politics.md).
#
# Nobody schedules a war: members record a grudge (threat, 0..1) toward each player who hit them. An alliance's
# grievance against another is the sum of what its members hold toward the other's members; past this line its
# leader declares war, provided the other side does not hold the larger grievance (then it is theirs to declare).
# A battle leaves about 0.5 of threat (0.3 appraised, 0.2 recorded): one raid is a grudge, two are a war. At 1.5, two
# near-equal alliances of two traded four battles and never declared (9406).
war_grievance: 0.8

# The leader's words. {tag} is the other alliance's tag. Players read these; the module wrote them from the decision.
lines:
  war_broadcast: ["We are at war with [{tag}]. Their planets and moons are targets; join every ACS on them.", "War with [{tag}]. Hit their planets and moons, join every ACS you see.", "[{tag}] is the enemy now. Probe them, hit them, and join the ACS on their moons."]
  war_to_leader: ["Your members have hit ours once too often. [{tag}] and we are at war.", "[{tag}]: we are done being farmed by your people. This is war.", "Enough. Your members keep hitting ours, so [{tag}] and we are at war from now."]
  war_external: "War: [{tag}]"
  pact_offer: ["We are both at war with [{tag}]. Non-aggression between us until it is over?", "[{tag}] is hitting us both. NAP until they are dealt with?", "Same enemy, [{tag}]. Want to leave each other alone and focus on them?"]
  flank_offer: ["We have our hands full with [{tag}]. NAP between us so neither of us fights two wars?", "[{tag}] is the war we are fighting. Leave each other alone, we have no time for a second front?", "We are busy with [{tag}]. Non-aggression with you, so we can finish that first?"]
  pact_accept: ["Agreed. No fleet of ours flies at [{tag}].", "Deal. We stay off you, [{tag}] is the target.", "Ok, NAP. Our fleets stay clear of [{tag}]."]
  betrayal_broadcast: "Our pact with [{tag}] is over. They are a target from today; hit them before they regroup."
  conspiracy_offer: "[{tag}] holds half the universe. A pact between us and war on them together; not a word to our members until the fleets fly."
  conspiracy_accept: "Agreed. We hit [{tag}] together."
  pact_refuse: "No pact. [{tag}] has hit us too often for that."
  war_declared_on_us: "[{tag}] has declared war on us. Their planets and moons are targets; join every ACS on them."
  peace_broadcast: "The war with [{tag}] is over. Stand down; no fleet of ours flies at them unless they hit us again."
  betrayal_to_leader: "The war that made us partners is finished, and so is our pact. [{tag}] and we are at war."

# A leader who betrays (persona taste, alliance-ambition.yaml) breaks a pact only once no war is left open and its
# alliance has this many times the partner's points: players turn on a weaker partner, not on an equal.
betray_strength_ratio: 2.0

# When one alliance holds more than this share of all alliance points, the two strongest AI-led runners-up conspire:
# a private pact and a shared war on it. One alliance owning the server is what makes the rest gang up.
coalition_share: 0.5

# A war ends by peace, not a timer (wiki War: "peace or surrender"; 2006 board interviews: hostilities "diminished" and
# "no real bitterness" once the fighting stopped, grudges.yaml). Once it has stood this many hours and the grievance the two
# sides still hold against each other (both ways, grudges fading) is under this line, the declarer announces peace. A new
# raid raises the grievance again and a new war follows at war_grievance: the gap between the two lines is the truce.
peace_grievance: 0.3
war_minimum_hours: 24

# An alliance whose pact partner is already at war with another joins that war on this share of war_grievance (alliance
# guide: "Allies are expected to support each other in war-time and revenge"). One raid (0.5) against a partner's enemy is
# then enough where two were needed alone.
ally_war_factor: 0.5

# An alliance does not declare on one more than this many times stronger in points unless a pact partner is already at war
# with it (the judge, 9437: a two-member club declared on a bloc it was hit by five to one). The grudge fades meanwhile.
war_max_strength_ratio: 4.0

# An alliance does not declare a war while it is already at war with this many alliances, as declarer or target: a second
# front against two blocs at once loses both (the judge on 9444). A coalition war (conspire) is not counted.
max_open_wars: 1
