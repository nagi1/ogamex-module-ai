# A phase may write its own lists (`phases: <phase>: <key>`); the flat lists above stay the fallback
# every phase the file does not name. The opening writes none (the research path is kept: an account that never colonises stays "early", and the colony needs the astrophysics the path leads to): an account that has settled no planet of
# its own is opened by the module's own order -- the capacity the host throttles it without, then the
# facilities its first ambitions wait on, then the mine that repays fastest -- and the ordered lists
# above take over on the planets of a settled account, which is where a guide does a player's work.
phases:
  early:
    opening: []
# The late hulls and defences (shares of the late fleet and wall the wiki describes) stay in the same list: one the account
# cannot build yet is skipped, so they only start to count once their requirements are met.
# Attack hulls follow 599 real late battles (OGMem archive, read 10 Oct 2026): by count the attacking fleet is about
# 35-50% battlecruisers and 20-45% cruisers, 4-7% battleships, 3-13% light fighters, and only 2-3% destroyers and bombers.
# A destroyer-and-bomber heavy list (the wiki's theory) is not what players fly.
fleet_template:
  # Class ships: only the class the host lets build one does (General reaper, Collector crawler, Discoverer pathfinder).
  reaper: 5
  pathfinder: 3
  battlecruiser: 35
  cruiser: 25
  battle_ship: 7
  light_fighter: 6
  destroyer: 4
  bomber: 3
  deathstar: 3
  large_cargo: 10
  recycler: 7
defence_template:
  rocket_launcher: 60
  light_laser: 40
  gauss_cannon: 5
  plasma_turret: 5
  small_shield_dome: 1
  large_shield_dome: 1
  anti_ballistic_missile: 5
