  - [crystal_mine, 1]
  - [metal_mine, 3]
  - [solar_plant, 2]
  - [crystal_mine, 2]
  - [robot_factory, 1]
  - [deuterium_synthesizer, 1]
  - [shipyard, 1]
  - [research_lab, 1]
