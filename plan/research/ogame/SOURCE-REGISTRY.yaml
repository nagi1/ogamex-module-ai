# OGame source registry — personality/behaviour workflow.
#
# Canonical id namespace: plan/details/research/strategy/sources.yaml. Reuse its ids verbatim.
# This file registers ONLY sources that do not yet exist there, in the same id families
# (FOR-/ORG-/GF-/TP-/WIK-/BOT-/SIM-/RDT-/STA-/ACA-/PLW-/DEW-/DEF-/FRB-). When a source here
# feeds strategy research too, promote it to the canonical store and delete the row here —
# never keep two rows for one source.

version: 1

# Per-source fields a raw-evidence file and a synthesis claim must be able to resolve:
#   id            stable id (canonical family prefix + number)
#   title         source title as published
#   url           original URL (or the board thread anchor)
#   capture_url   Wayback/archive capture used when the live URL moved (may be empty)
#   family        id family (official-gameforge-forum, gameforge, third-party, fandom, bot,
#                 sim, reddit, stats, academic, non-english)
#   domains       what the source evidences (personas, authenticity, routine, communication, …)
#   retrieved_at  ISO date the source was fetched
#   license       accessibility note (public page, archive replay, login-gated, …)

