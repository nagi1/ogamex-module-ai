# Canonical strategy knowledge store. This file is authoritative: edit here, not in the Markdown
# catalogs under plan/details/research/. Those remain the human narrative and are derived from this
# store, never the reverse.
#
# The atomic contested claims, preserved verbatim and never silently reconciled. A principle that
# consumes one of these carries the `contested` confidence marker and a pointer back to this id.

- id: CLAIM-RAID-014
  verdict: REJECTED
  subject: single-raid gate
  claim: ogames.net publishes `Profit = Loot + Debris − Fuel − Losses`; the module deliberately keeps
    debris out of the raid gate (two missions, two capacities).
  disposition: module doctrine unchanged; the split is recorded in `RAID-014` and `T4`/`F4`.

- id: CLAIM-FS-007
  verdict: CONTESTED
  subject: landing buffer
  claim: '"10–20 minutes after you log in" (single non-Gameforge source) vs "+30–60 minutes" (Gameforge).'
  disposition: a persona band, never a constant.

- id: CLAIM-CRASH-003
  verdict: CORRECTED
  subject: same-planet relocation recallability
  claim: a same-planet relocation is not recallable (`cancelMission` early-returns on
    `planet_id_from === planet_id_to`); a deployment between two own planets is recallable.
  disposition: '`F2`/`V4` state the correction.'

- id: CLAIM-CRASH-005
  verdict: PARTIALLY_VERIFIED
  subject: moon-destruction fleet redirect
  claim: moon destruction (type 9) redirects returning fleets to the planet; the fleet-redirect
    consequence is not re-verified against the host.
  disposition: '`F6` marks it as such.'

- id: CLAIM-FLE-006
