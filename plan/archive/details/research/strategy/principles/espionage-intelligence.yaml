- id: INT-005
  title: The activity stamp is a planet-context action
  domain: espionage
  confidence: A
  status: researched
  principle: the 15-min marker is set by any planet-context request, not an open tab; it names which planet
    was touched and when.
  inputs: planet-context actions, `time_last_update`
  exceptions: idle tab sets nothing.
  archetypes: all; fleeter-critical
  sources: TP-006
  ogamex: supported (`GalaxyController::getPlanetActivityStatus`) but unwired
  code: none
  priority: P1
  claim_type:
