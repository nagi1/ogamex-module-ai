  mechanism: a deterministic chain — probe → wait for report → evaluate → attack → schedule recycler →
    observe outcome — expressed as a plan, not an LLM-coordinated loop.
  ogamex_mapping: OGameX actions are currently individual intents. The recycle trip (attack → debris →
