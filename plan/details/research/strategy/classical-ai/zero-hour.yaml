- id: ZH-8
  title: Success/failure priority feedback
  source_game: zero-hour
  game: Zero Hour
  confidence: B (handoff; the brief flags it as "bounded stateful adaptation, NOT ML")
  problem: the AI repeats a pattern that has just failed, and never doubles down on one that worked.
  vanilla_mod: team success/failure alters that team's priority — a successful attack pattern becomes
    more likely, a failed one loses priority.
  mechanism: a bounded per-pattern counter adjusted by outcomes, read back into the score.
  why: adapts to the *current* universe without any learning runtime; fully deterministic and replayable.
  failure_modes: momentum lock-in (a temporarily-hot pattern crowds out alternatives); a counter that
    never decays.
  generalizable: yes, as **bounded recent-outcome modifiers** over existing memory/state.
  ogamex_mapping: hypothesis **H8** — a recent low-risk raid success temporarily boosts the raiding posture;
    repeated losses push toward recovery. The existing `recovery_factor` and the decision-trace outcome
    records are the raw material; no new persistence layer is implied.
  sources: SkirmishScripts modding practice (handoff-named).
