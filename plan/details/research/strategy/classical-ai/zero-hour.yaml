- id: ZH-5
  title: Context-gated candidate generation
  source_game: zero-hour
  game: Zero Hour
  confidence: B (handoff)
  problem: scoring obviously-irrelevant strategies wastes the budget and makes bad choices reachable.
  vanilla: teams are only produced when their condition is true (enemy has tanks → build the anti-tank
    response).
  mechanism: the candidate never exists unless its precondition holds — generation is context-sensitive,
    scoring is only comparative among the live set.
  generalizable: 'yes — but OGameX''s broad-then-score design is deliberate (gate 2; the techniques note
