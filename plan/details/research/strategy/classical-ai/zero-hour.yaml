- id: ZH-7
  title: Sequential multi-step plans
  source_game: zero-hour
  game: Zero Hour
  confidence: A (handoff)
  problem: some behaviours are sequences, not isolated actions.
  vanilla: the script system runs sequential scripts with subroutines, counters, flags, timers, one-shot
