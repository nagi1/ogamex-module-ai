- id: ZH-1
  title: Economic state modifies action cadence
  source_game: zero-hour
  game: Zero Hour
  confidence: A (handoff, named file)
  problem: a fixed production cadence ignores whether the account is rich or broke.
  vanilla: '`AIData.ini` polls structure/team production at `StructureSeconds`/`TeamSeconds`; `Wealthy`/`Poor`
    resource thresholds flip `StructuresWealthyRate`/`StructuresPoorRate` / `TeamsWealthyRate`/`TeamsPoorRate`.'
  mechanism: STATE → parameter modifier → changed behaviour (wealthy → build/spend faster; poor → slow
    production and preserve resources).
  why: cadence tracks economic condition instead of a constant; two thresholds and four rates.
  cost: zero per-tick — the modifier is read, not computed.
  failure_modes: a threshold cliff at the boundary; a new parameter per state instead of a shared modifier.
  generalizable: yes — the lesson is "a few named states modify a small parameter surface", never a giant
    strategy tree.
  ogamex_mapping: candidate breadth and re-evaluation cadence modulated by account stage and resource
    pressure. Today `ArchetypePolicy` moves the *action type*, not the cadence — the exact distinction
    the brief calls out. Open; would need evidence before a `spend/save/normal` surface.
  sources: '`FreemanZY/Command_And_Conquer_INI` → `AIData.ini`; EA source `AI.h`/`AIPlayer.h`.'
- id: ZH-2
  title: Derived world-state signals from raw sensors
  source_game: zero-hour
  game: Zero Hour
  confidence: A (handoff)
  problem: reacting to a single weak enemy unit makes the AI twitchy and predictable.
  vanilla_improved: a script threshold sets `EnemyInBase = true` only when enough enemy force has entered,
    rather than on first contact.
  mechanism: aggregate raw events over a threshold into a **named boolean derived state**.
  why: one reaction per state transition, not per event; the state is inspectable and tunable.
  cost: a counter and a comparison per event; negligible.
  failure_modes: a threshold that never fires (the AI stops reacting); a state that is set and never cleared.
  generalizable: yes, directly.
  ogamex_mapping: '`PerceptionSnapshot` should expose derived features — `under_sustained_threat`, `high_fleet_exposure`,
    `resource_overflow_pressure`, `likely_target_online`, `recent_hostility` — rather than forcing every
    planner to re-derive them from raw events. Partially present (`recovery_factor`); the rest are unwired.'
  sources: WorldBuilder script guide (handoff-named).
