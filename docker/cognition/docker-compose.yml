# Opt-in Phase 3 cognition drivers.
#
# This file is deliberately separate from the application stack: no Phase 3
# baseline requires any driver, and the AI module must keep working with every
# optional driver absent. The application container reaches these services over
# the host gateway it already maps (`host.docker.internal`), so the host Compose
# stack stays untouched.
#
#   docker compose -f Modules/AI/docker/cognition/docker-compose.yml up -d --build
#   docker compose -f Modules/AI/docker/cognition/docker-compose.yml up -d fatima
#
# The published ports bind every interface because the application container
# arrives over the Docker host gateway, not over loopback. Restrict the bind
# address on a shared server, or attach these services to the application's
# private network.
name: ogamex-ai-cognition

services:
  # Structured CBR scoring behind Modules\AI\Contracts\ExperienceEngine.
  cbrkit:
    build:
      context: ./cbrkit
    image: ogamex-ai-cognition-cbrkit:1.6.0
    ports:
      - "${AI_CBRKIT_BIND:-0.0.0.0}:${AI_CBRKIT_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Integrated appraisal and social importance behind Modules\AI\Contracts\AffectEngine.
  fatima:
    build:
      context: ./fatima
    image: ogamex-ai-cognition-fatima:net8
    ports:
      - "${AI_FATIMA_BIND:-0.0.0.0}:${AI_FATIMA_PORT:-8092}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:8000/scenarios"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # A second FAtiMA sidecar: each one answers a single request at a time, so personas are spread over both
  # (AI_COGNITION_FATIMA_URLS=http://host.docker.internal:8092,http://host.docker.internal:8095).
  fatima2:
    build:
      context: ./fatima
    image: ogamex-ai-cognition-fatima:net8
    ports:
      - "${AI_FATIMA_BIND:-0.0.0.0}:${AI_FATIMA2_PORT:-8095}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:8000/scenarios"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Ranked older-memory recall behind Modules\AI\Contracts\LongTermMemory. The driver keeps no
  # store of its own: every request carries the memories the module authorises for that recall.
  agentos:
    build:
      context: ./agentos
    image: ogamex-ai-cognition-agentos:0.10.16
    ports:
      - "${AI_AGENTOS_BIND:-0.0.0.0}:${AI_AGENTOS_PORT:-8093}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Bounded Theory-of-Mind social stance behind Modules\AI\Contracts\SocialCognition. The core is
  # pure Python + stdlib, so the image carries only the pinned source and a stdlib HTTP server.
  psychsim:
    build:
      context: ./psychsim
    image: ogamex-ai-cognition-psychsim:1.0.0
    ports:
      - "${AI_PSYCHSIM_BIND:-0.0.0.0}:${AI_PSYCHSIM_PORT:-8094}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # Extra FAtiMA replicas for the social gateway only (internal network, no host ports). Same image as fatima, never
  # built here: after rebuilding the fatima image, `up -d fatima3 fatima4 fatima5 fatima6` moves them onto it.
  fatima3: &fatima-replica
    image: ogamex-ai-cognition-fatima:net8
    pull_policy: never
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "3", "http://127.0.0.1:8000/scenarios"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
  fatima4: *fatima-replica
  fatima5: *fatima-replica
  fatima6: *fatima-replica

  # AgentOS replicas for the gateway (Node answers one item at a time, ~150 items/s each; measured 6 Nov).
  agentos2: &agentos-replica
    image: ogamex-ai-cognition-agentos:0.10.16
    pull_policy: never
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  agentos3: *agentos-replica
  agentos4: *agentos-replica

  # PsychSim replicas for the gateway: /social/partner takes ~1.3 s per item at horizon 2 (measured 6 Nov).
  psychsim2: &psychsim-replica
    image: ogamex-ai-cognition-psychsim:1.0.0
    pull_policy: never
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
  psychsim3: *psychsim-replica
  psychsim4: *psychsim-replica
  psychsim5: *psychsim-replica
  psychsim6: *psychsim-replica
  psychsim7: *psychsim-replica
  psychsim8: *psychsim-replica

  # One front door for every engine: proxy, batch fan-out, answer cache (see gateway/README.md).
  gateway:
    build:
      context: ./gateway
    image: ogamex-ai-cognition-gateway:1.0.0
    ports:
      - "${AI_GATEWAY_BIND:-0.0.0.0}:${AI_GATEWAY_PORT:-8099}:8099"
    environment:
      # FAtiMA sessions are stateful: the gateway uses dedicated replicas so it never interleaves with the
      # live PHP module's sessions on fatima/fatima2.
      FATIMA_URLS: ${AI_GATEWAY_FATIMA_URLS:-http://fatima3:8000,http://fatima4:8000,http://fatima5:8000,http://fatima6:8000}
      PSYCHSIM_URLS: ${AI_GATEWAY_PSYCHSIM_URLS:-http://psychsim:8080,http://psychsim2:8080,http://psychsim3:8080,http://psychsim4:8080,http://psychsim5:8080,http://psychsim6:8080,http://psychsim7:8080,http://psychsim8:8080}
      CBRKIT_URLS: ${AI_GATEWAY_CBRKIT_URLS:-http://cbrkit:8080}
      AGENTOS_URLS: ${AI_GATEWAY_AGENTOS_URLS:-http://agentos:8080,http://agentos2:8080,http://agentos3:8080,http://agentos4:8080}
    volumes:
      - gateway-cache:/cache
      # Read only to learn which image each replica runs (the cache key); nothing is ever written.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - fatima3
      - fatima4
      - fatima5
      - fatima6
    restart: unless-stopped

volumes:
  gateway-cache:
