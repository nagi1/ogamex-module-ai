; AI module queue workers, applied by the host's generic module loader
; (docker/module-hooks.sh) only while this module is enabled and the database
; queue driver is active. Horizon manages the equivalent pools when
; QUEUE_CONNECTION=redis; see Modules/AI/config/horizon.php.
;
; --timeout covers the longer language request; each job's own $timeout stays
; below it.
[program:ai-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work --queue=ai,ai-language --sleep=1 --timeout=60 --memory=256 --no-interaction
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=70
stopsignal=TERM
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
